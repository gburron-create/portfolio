<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#bbb;stroke-width:1.2}
      .me{fill:#e1f5ee;stroke:#0F6E56;stroke-width:1.6}
      .hub{fill:#f5f8f7;stroke:#0F6E56;stroke-width:2}
      .zone{fill:none;stroke:#ddd;stroke-dasharray:4 4}
      .h{font-weight:600}
      .s{font-size:12px;fill:#555}
      .z{font-size:12px;fill:#0F6E56;font-weight:600;letter-spacing:.04em}
      .l{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <!-- Pipeline lane -->
  <rect class="zone" x="10" y="14" width="940" height="170" rx="10"/>
  <text class="z" x="24" y="36">DISCOVERY PIPELINE: RUNS ITSELF EVERY WEEK</text>
  <rect class="box" x="24" y="52" width="160" height="84" rx="6"/>
  <text class="h" x="36" y="74">Sources</text><text class="s" x="36" y="94">about 60 job boards</text><text class="s" x="36" y="110">and portals, plus my</text><text class="s" x="36" y="126">job-alert emails</text>
  <rect class="box" x="206" y="52" width="160" height="84" rx="6"/>
  <text class="h" x="218" y="74">Free filters</text><text class="s" x="218" y="94">skip anything seen</text><text class="s" x="218" y="110">before or clearly</text><text class="s" x="218" y="126">off-topic</text>
  <rect class="box" x="388" y="52" width="160" height="84" rx="6"/>
  <text class="h" x="400" y="74">Title screen</text><text class="s" x="400" y="94">a small model reads</text><text class="s" x="400" y="110">titles only; cheap</text><text class="s" x="400" y="126">first, careful second</text>
  <rect class="box" x="570" y="52" width="170" height="84" rx="6"/>
  <text class="h" x="582" y="74">Read and score</text><text class="s" x="582" y="94">full posting against my</text><text class="s" x="582" y="110">plain-text rubric; if it</text><text class="s" x="582" y="126">can't be read, never guess</text>
  <rect class="hub" x="764" y="52" width="170" height="84" rx="8"/>
  <text class="h" x="776" y="74">Ranked tracker</text><text class="s" x="776" y="94">every posting scored,</text><text class="s" x="776" y="110">best fits first, with</text><text class="s" x="776" y="126">a weekly summary</text>
  <path class="l" d="M184,94 L204,94"/><path class="l" d="M366,94 L386,94"/><path class="l" d="M548,94 L568,94"/><path class="l" d="M740,94 L762,94"/>
  <text class="s" x="24" y="166">Shared by both halves: one master record of verified facts about my career.</text>

  <!-- Builder lane -->
  <rect class="zone" x="10" y="212" width="940" height="300" rx="10"/>
  <text class="z" x="24" y="234">APPLICATION BUILDER: AGENTS DRAFT, I DECIDE</text>
  <rect class="me" x="24" y="250" width="160" height="70" rx="6"/>
  <text class="h" x="36" y="272">I choose a posting</text><text class="s" x="36" y="292">from the tracker,</text><text class="s" x="36" y="308">and when to apply</text>
  <rect class="box" x="206" y="250" width="160" height="70" rx="6"/>
  <text class="h" x="218" y="272">Posting analysis</text><text class="s" x="218" y="292">requirements, keywords,</text><text class="s" x="218" y="308">screening questions</text>
  <rect class="me" x="388" y="250" width="160" height="70" rx="6"/>
  <text class="h" x="400" y="272">Fit and gaps</text><text class="s" x="400" y="292">I decide to apply or not</text><text class="s" x="400" y="308">and fill the gaps</text>
  <rect class="box" x="570" y="250" width="170" height="70" rx="6"/>
  <text class="h" x="582" y="272">Evidence and draft</text><text class="s" x="582" y="292">from my bank of approved</text><text class="s" x="582" y="308">bullets and narratives</text>
  <rect class="box" x="764" y="250" width="170" height="70" rx="6"/>
  <text class="h" x="776" y="272">Automatic checks</text><text class="s" x="776" y="292">35 rules, 20 locked facts,</text><text class="s" x="776" y="308">run on every save</text>
  <path class="l" d="M184,285 L204,285"/><path class="l" d="M366,285 L386,285"/><path class="l" d="M548,285 L568,285"/><path class="l" d="M740,285 L762,285"/>

  <rect class="box" x="764" y="350" width="170" height="70" rx="6"/>
  <text class="h" x="776" y="372">Fact audit and panel</text><text class="s" x="776" y="392">every claim traced to a</text><text class="s" x="776" y="408">source; outside readers</text>
  <rect class="me" x="570" y="350" width="170" height="70" rx="6"/>
  <text class="h" x="582" y="372">I review in pieces</text><text class="s" x="582" y="392">letter by paragraph,</text><text class="s" x="582" y="408">resume by section</text>
  <rect class="box" x="388" y="350" width="160" height="70" rx="6"/>
  <text class="h" x="400" y="372">Final build</text><text class="s" x="400" y="392">Word files, page fit</text><text class="s" x="400" y="408">checked, apply link</text>
  <rect class="me" x="206" y="350" width="160" height="70" rx="6"/>
  <text class="h" x="218" y="372">I apply</text><text class="s" x="218" y="392">and the builder tells</text><text class="s" x="218" y="408">the pipeline</text>
  <path class="l" d="M849,320 L849,348"/><path class="l" d="M762,385 L742,385"/><path class="l" d="M568,385 L550,385"/><path class="l" d="M386,385 L368,385"/>

  <!-- links between lanes -->
  <path class="l" d="M849,136 L849,198 L104,198 L104,248"/>
  <path class="l" d="M286,420 L286,470 L944,470 L944,94 L936,94" stroke-dasharray="5 4"/>
  <text class="s" x="300" y="492">"applied" goes back to the tracker; the two halves also message each other</text>

  <!-- legend -->
  <rect class="me" x="24" y="532" width="16" height="16" rx="3"/><text class="s" x="48" y="545">my decision points</text>
  <rect class="box" x="190" y="532" width="16" height="16" rx="3"/><text class="s" x="214" y="545">done by agents and scripts</text>
</svg>
