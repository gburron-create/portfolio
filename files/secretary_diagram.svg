<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#bbb;stroke-width:1.2}
      .hub{fill:#f5f8f7;stroke:#0F6E56;stroke-width:2}
      .zone{fill:none;stroke:#ddd;stroke-dasharray:4 4}
      .h{font-weight:600}
      .s{font-size:12px;fill:#555}
      .z{font-size:12px;fill:#0F6E56;font-weight:600;letter-spacing:.04em}
      .l{stroke:#555;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>

  <!-- Inputs -->
  <text class="z" x="20" y="150">INPUTS</text>
  <rect class="box" x="20" y="165" width="190" height="52" rx="6"/>
  <text class="h" x="32" y="187">Email and calendar</text><text class="s" x="32" y="205">Gmail, Google Calendar</text>
  <rect class="box" x="20" y="229" width="190" height="52" rx="6"/>
  <text class="h" x="32" y="251">Me, from my phone</text><text class="s" x="32" y="269">talk, tick tasks, share links</text>
  <rect class="box" x="20" y="293" width="190" height="52" rx="6"/>
  <text class="h" x="32" y="315">Meeting recordings</text><text class="s" x="32" y="333">plus my own notes</text>

  <!-- Server zone -->
  <rect class="zone" x="250" y="20" width="460" height="230" rx="10"/>
  <text class="z" x="264" y="42">ALWAYS-ON SERVER</text>
  <rect class="box" x="264" y="55" width="210" height="182" rx="6"/>
  <text class="h" x="276" y="77">Scheduled routines</text>
  <text class="s" x="276" y="99">6:15  media intake</text>
  <text class="s" x="276" y="119">7:00  daily brief: day plan</text>
  <text class="s" x="276" y="139">1:00  daily brief again</text>
  <text class="s" x="276" y="159">4:15  sweep: file what's done</text>
  <text class="s" x="276" y="179">11:00  sweep (safety net)</text>
  <text class="s" x="276" y="207">Free script check first;</text>
  <text class="s" x="276" y="223">Claude runs only if there's work</text>
  <rect class="box" x="488" y="55" width="208" height="86" rx="6"/>
  <text class="h" x="500" y="77">Secretary agent</text>
  <text class="s" x="500" y="97">"What next?", done, new tasks,</text>
  <text class="s" x="500" y="113">questions, weekly review</text>
  <text class="s" x="500" y="129">one place to talk to</text>
  <rect class="box" x="488" y="151" width="208" height="86" rx="6"/>
  <text class="h" x="500" y="173">Helper agents</text>
  <text class="s" x="500" y="193">email drafter (never sends)</text>
  <text class="s" x="500" y="209">meeting notes (local transcription)</text>
  <text class="s" x="500" y="225">keeps bulky work separate</text>

  <!-- Hub -->
  <rect class="hub" x="330" y="300" width="300" height="96" rx="10"/>
  <text class="h" x="480" y="330" text-anchor="middle" font-size="16">Obsidian vault</text>
  <text class="s" x="480" y="352" text-anchor="middle">the single source of truth: tasks, rules, logs</text>
  <text class="s" x="480" y="370" text-anchor="middle">every part reads and writes here;</text>
  <text class="s" x="480" y="386" text-anchor="middle">files stay on my own devices</text>

  <!-- Outputs -->
  <text class="z" x="750" y="150">OUTPUTS</text>
  <rect class="box" x="750" y="165" width="190" height="52" rx="6"/>
  <text class="h" x="762" y="187">Day plan</text><text class="s" x="762" y="205">and one "what next" task</text>
  <rect class="box" x="750" y="229" width="190" height="52" rx="6"/>
  <text class="h" x="762" y="251">Phone widget</text><text class="s" x="762" y="269">and timed notifications</text>
  <rect class="box" x="750" y="293" width="190" height="52" rx="6"/>
  <text class="h" x="762" y="315">Email drafts, labels</text><text class="s" x="762" y="333">saved for my OK, never sent</text>
  <rect class="box" x="750" y="357" width="190" height="52" rx="6"/>
  <text class="h" x="762" y="379">Meeting and media notes</text><text class="s" x="762" y="397">with my to-dos in the inbox</text>

  <!-- Maintenance -->
  <rect class="box" x="330" y="470" width="300" height="76" rx="6"/>
  <text class="h" x="342" y="492">Maintenance session (laptop)</text>
  <text class="s" x="342" y="512">every change staged, tested and shown</text>
  <text class="s" x="342" y="528">as a diff; applied only on my go</text>

  <!-- Arrows -->
  <path class="l" d="M210,191 C270,191 290,320 328,330"/>
  <path class="l" d="M210,255 C260,255 290,345 328,348"/>
  <path class="l" d="M210,319 C260,319 300,365 328,366"/>
  <path class="l" d="M369,239 L369,298"/>
  <path class="l" d="M400,298 L400,241"/>
  <path class="l" d="M592,239 L592,298"/>
  <path class="l" d="M620,298 L620,241"/>
  <path class="l" d="M632,330 C690,330 700,191 748,191"/>
  <path class="l" d="M632,345 C690,345 700,255 748,255"/>
  <path class="l" d="M632,360 C690,360 700,319 748,319"/>
  <path class="l" d="M632,375 C690,375 700,383 748,383"/>
  <path class="l" d="M480,468 L480,398"/>
  <text class="s" x="406" y="276">reads, writes</text>
  <text class="s" x="490" y="440">maintains</text>
</svg>
